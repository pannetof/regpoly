name: ci-slow

# Nightly + label-triggered slow lane: the heavyweight MTToolBox d5 cross
# checks and the nbmake notebook executions. No e2e/Playwright here (that
# lives in the App repo). NOTE: test_regpoly_matches_mttoolbox_d5 currently
# has a known failure on mt-mt19937 (slow + disagrees with the frozen
# reference); the references need re-baselining — see the test's note.

on:
  schedule:
    - cron: "0 6 * * *"
  pull_request:
    types: [labeled, synchronize, opened, reopened]
  workflow_dispatch: {}

jobs:
  slow:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'slow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libntl-dev libgmp-dev libgf2x-dev cmake build-essential pybind11-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and the package
        run: |
          uv python install 3.11
          uv sync --group test

      - name: Build C++ tests
        run: |
          cmake -S cpp -B build -DREGPOLY_BUILD_TESTS=ON
          cmake --build build -j

      - name: Run ctest
        run: ctest --test-dir build --output-on-failure

      - name: Run pytest (default + slow)
        run: uv run pytest -m "slow or (not slow and not e2e)"
